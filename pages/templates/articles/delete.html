{% extends 'base.html' %}

{% block title %}
Удалить новость | News Portal
{% endblock %}

{% block content %}

<section class="signin-page">
    <h1 class="page-title">
        Удалить новость
    </h1>

    <p>
        Вы действительно хотите удалить новость?
    </p>

    <div class="text-card">
        <h2>
            {{ article.title }}
        </h2>

        <p>
            {{ article.short_description }}
        </p>
    </div>

    <form action="{% url 'article_delete' article.id %}" method="post" class="signin-form">
        {% csrf_token %}

        <button type="submit" class="delete-btn">
            Да, удалить
        </button>

        <a href="{% url 'articles' %}" class="back-link">
            Отмена
        </a>
    </form>
</section>

{% endblock %}
